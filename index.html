<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مراسلات حية - لمس ورسم</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f9fc; height: 100vh; display: flex; flex-direction: column; }
        .app-container { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 32px 32px 0 0; overflow: hidden; }
        .app-header { padding: 20px 20px 10px; background: white; border-bottom: 1px solid #e2edf2; }
        .app-header h1 { font-size: 1.6rem; color: #1e6f5c; display: flex; align-items: center; gap: 8px; }
        .user-greeting { font-size: 0.85rem; color: #5f7f8c; margin-top: 5px; }
        .horizontal-chats { flex: 1; padding: 16px 0 8px 0; overflow-x: auto; overflow-y: hidden; white-space: nowrap; scroll-behavior: smooth; direction: ltr; }
        .chats-wrapper { display: inline-flex; gap: 16px; padding: 0 20px; direction: rtl; }
        .chat-card { background: #ffffff; width: 240px; border-radius: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 1px solid #e0eff4; cursor: pointer; display: inline-flex; flex-direction: column; padding: 16px; text-align: center; }
        .avatar { width: 70px; height: 70px; background: #d7f0ea; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 2rem; color: #1e6f5c; }
        .contact-name { font-weight: 800; font-size: 1.2rem; margin-bottom: 8px; color: #154e5c; }
        .last-message { font-size: 0.8rem; color: #5f7c8a; overflow: hidden; text-overflow: ellipsis; white-space: normal; min-height: 38px; }
        .bottom-icons { background: white; border-top: 1px solid #e2edf2; display: flex; justify-content: space-around; padding: 12px 20px 20px; gap: 20px; }
        .icon-btn { background: #f0f6f9; border: none; border-radius: 60px; padding: 10px 20px; font-size: 1.3rem; color: #1e6f5c; cursor: pointer; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
        .icon-btn i { font-size: 1.3rem; }
        .icon-btn span { font-size: 0.8rem; font-weight: 500; }
        .chat-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 1000; display: flex; flex-direction: column; padding: 16px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: white; border-radius: 32px; padding: 24px; width: 85%; max-width: 320px; text-align: center; }
        .hidden { display: none; }
        /* أنماط الرسم */
        .drawing-canvas { background: #fff; border: 2px solid #1e6f5c; border-radius: 24px; cursor: crosshair; margin-top: 8px; touch-action: none; }
        .drawing-tools { display: flex; gap: 10px; margin: 8px 0; align-items: center; }
        .drawing-tools button { background: #eef2f5; border: none; border-radius: 30px; padding: 6px 12px; font-size: 0.8rem; }
        .haptic-btn { background: #ffb6c1; border: none; border-radius: 40px; padding: 12px; font-size: 1.2rem; margin: 5px 0; }
        /* شاشة تسجيل الدخول */
        #authScreen { padding: 2rem; text-align: center; background: white; border-radius: 32px; margin: 2rem 1rem; }
        #authScreen input { display: block; margin: 10px auto; width: 90%; padding: 12px; border-radius: 28px; border: 1px solid #ccc; }
        #authScreen button { background: #1e6f5c; color: white; border: none; padding: 10px 20px; border-radius: 60px; margin: 8px; cursor: pointer; }
        #authScreen .toggle-link { background: none; color: #1e6f5c; text-decoration: underline; }
        .message-bubble { max-width: 85%; padding: 10px 15px; border-radius: 24px; margin-bottom: 12px; word-break: break-word; }
        .my-message { background: #dcf8e7; align-self: flex-end; border-bottom-right-radius: 4px; }
        .other-message { background: #f0f2f5; align-self: flex-start; border-bottom-left-radius: 4px; }
        .drawing-bubble { background: #e9ecef; padding: 8px; border-radius: 24px; max-width: 250px; }
        .drawing-bubble canvas { border-radius: 16px; background: white; width: 200px; height: 150px; }
        .haptic-bubble { background: #ffe0e6; padding: 8px 16px; border-radius: 40px; font-size: 0.9rem; }
        .chat-header { display: flex; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
        .back-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .messages-area { flex: 1; overflow-y: auto; padding: 16px 8px; display: flex; flex-direction: column; }
        .chat-input-area { display: flex; gap: 8px; padding: 12px; background: white; border-top: 1px solid #eee; align-items: center; flex-wrap: wrap; }
        .chat-input-area input { flex: 2; padding: 12px; border-radius: 40px; border: 1px solid #ccc; }
        .chat-input-area button { background: #1e6f5c; border: none; border-radius: 40px; padding: 0 16px; color: white; height: 44px; }
    </style>
</head>
<body>
<!-- شاشة تسجيل الدخول -->
<div id="authScreen">
    <h2>تسجيل الدخول أو إنشاء حساب</h2>
    <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
    <input type="text" id="nameInput" placeholder="الاسم (للتسجيل فقط)" style="display: none;">
    <input type="password" id="passwordInput" placeholder="كلمة المرور">
    <div>
        <button id="submitBtn">دخول</button>
        <button id="toggleBtn" class="toggle-link">إنشاء حساب</button>
        <button id="resetPwdBtn" class="toggle-link">نسيت كلمة المرور؟</button>
    </div>
    <div id="authMessage"></div>
</div>

<!-- الصفحة الرئيسية الأفقية -->
<div id="mainApp" class="hidden app-container">
    <div class="app-header">
        <h1><i class="fas fa-comment-dots"></i> رسائلي</h1>
        <div class="user-greeting" id="greetingName"></div>
    </div>
    <div class="horizontal-chats" id="horizontalChatsContainer">
        <div class="chats-wrapper" id="chatsWrapper"></div>
    </div>
    <div class="bottom-icons">
        <button class="icon-btn" id="shareQrBtn"><i class="fas fa-qrcode"></i><span>رمزي</span></button>
        <button class="icon-btn" id="scanQrBtn"><i class="fas fa-camera"></i><span>مسح</span></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>خروج</span></button>
    </div>
</div>

<script>
    // Firebase Config (خاصتك)
    const firebaseConfig = {
        apiKey: "AIzaSyBX8v0qIVjG-Z46fVDeEUDKcPxa_FQF9Qc",
        authDomain: "bnak-belaiba.firebaseapp.com",
        projectId: "bnak-belaiba",
        storageBucket: "bnak-belaiba.firebasestorage.app",
        messagingSenderId: "286736432059",
        appId: "1:286736432059:web:ec1ed4292850f00008229e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // عناصر شاشة تسجيل الدخول (نفس الكود القديم)
    const authScreen = document.getElementById('authScreen');
    const mainApp = document.getElementById('mainApp');
    const emailInput = document.getElementById('emailInput');
    const nameInput = document.getElementById('nameInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetPwdBtn = document.getElementById('resetPwdBtn');
    const authMessage = document.getElementById('authMessage');
    let isLoginMode = true;

    toggleBtn.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            nameInput.style.display = 'none';
            submitBtn.innerText = 'دخول';
            toggleBtn.innerText = 'إنشاء حساب';
        } else {
            nameInput.style.display = 'block';
            submitBtn.innerText = 'تسجيل';
            toggleBtn.innerText = 'لديك حساب؟ سجل دخول';
        }
        authMessage.innerHTML = '';
    });

    resetPwdBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) { authMessage.innerText = 'أدخل بريدك الإلكتروني'; return; }
        try {
            await auth.sendPasswordResetEmail(email);
            authMessage.innerHTML = '<span style="color:green;">تم إرسال رابط الاستعادة إلى بريدك</span>';
        } catch(e) { authMessage.innerText = e.message; }
    });

    submitBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        if (!email || !password) { authMessage.innerText = 'البريد وكلمة المرور مطلوبة'; return; }
        try {
            if (isLoginMode) {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                await loadUserData(cred.user);
            } else {
                const name = nameInput.value.trim();
                if (!name) { authMessage.innerText = 'الاسم مطلوب للتسجيل'; return; }
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(cred.user.uid).set({
                    id: cred.user.uid,
                    email: email,
                    name: name,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                await loadUserData(cred.user);
            }
        } catch(e) { authMessage.innerText = e.message; }
    });

    let currentUserId = null;
    let currentChatUnsub = null;

    async function loadUserData(user) {
        if (!user) return;
        currentUserId = user.uid;
        const doc = await db.collection('users').doc(user.uid).get();
        const userName = doc.exists ? doc.data().name : user.email.split('@')[0];
        document.getElementById('greetingName').innerText = `مرحباً ${userName}`;
        authScreen.classList.add('hidden');
        mainApp.classList.remove('hidden');
        loadHorizontalChats();
    }

    async function loadHorizontalChats() {
        if (!currentUserId) return;
        const contactsSnap = await db.collection('contacts').where('userId', '==', currentUserId).get();
        const contacts = [];
        for (const docSnap of contactsSnap.docs) {
            const contactId = docSnap.data().contactId;
            const userDoc = await db.collection('users').doc(contactId).get();
            if (userDoc.exists) {
                contacts.push({ id: contactId, name: userDoc.data().name || 'مستخدم' });
            }
        }
        const wrapper = document.getElementById('chatsWrapper');
        if (contacts.length === 0) {
            wrapper.innerHTML = `<div class="empty-chats">📭 لا توجد محادثات بعد<br>استخدم زر "مسح" لإضافة أصدقاء</div>`;
            return;
        }
        wrapper.innerHTML = '';
        for (const contact of contacts) {
            const chatId = [currentUserId, contact.id].sort().join('_');
            const lastMsgQuery = await db.collection('messages').doc(chatId).collection('msgs').orderBy('time', 'desc').limit(1).get();
            let lastText = 'لا توجد رسائل بعد';
            if (!lastMsgQuery.empty) {
                const msgData = lastMsgQuery.docs[0].data();
                if (msgData.type === 'haptic') lastText = '🤏 أرسل لك مشاعر';
                else if (msgData.type === 'drawing') lastText = '🎨 رسم';
                else lastText = msgData.text?.substring(0, 40) || 'رسالة';
            }
            const card = document.createElement('div');
            card.className = 'chat-card';
            card.innerHTML = `<div class="avatar"><i class="fas fa-user-circle"></i></div><div class="contact-name">${escapeHtml(contact.name)}</div><div class="last-message">${escapeHtml(lastText)}</div>`;
            card.addEventListener('click', () => openChat(contact.id, contact.name));
            wrapper.appendChild(card);
        }
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // ---------- ميزات المحادثة الجديدة: اللمس والرسم ----------
    let chatScreenDiv = null;
    let drawingMode = false;
    let canvas = null, ctx = null;
    let drawingActive = false;

    function openChat(contactId, contactName) {
        if (chatScreenDiv) chatScreenDiv.remove();
        chatScreenDiv = document.createElement('div');
        chatScreenDiv.className = 'chat-screen';
        chatScreenDiv.innerHTML = `
            <div class="chat-header">
                <button class="back-btn"><i class="fas fa-arrow-right"></i></button>
                <h3>${escapeHtml(contactName)}</h3>
            </div>
            <div class="messages-area" id="chatMessagesArea"></div>
            <div class="chat-input-area">
                <input type="text" id="messageTextInput" placeholder="اكتب رسالة...">
                <button id="sendTextBtn"><i class="fas fa-paper-plane"></i></button>
                <button id="hapticBtn" class="haptic-btn" style="background:#ffb6c1;"><i class="fas fa-hand-peace"></i></button>
                <button id="drawingToggleBtn"><i class="fas fa-paintbrush"></i></button>
            </div>
            <div id="drawingPanel" style="display: none; padding: 8px; background: #f8f9fa; border-radius: 24px; margin-top: 8px;">
                <canvas id="drawCanvas" width="280" height="200" class="drawing-canvas" style="width:100%; height:auto; touch-action:none;"></canvas>
                <div class="drawing-tools">
                    <button id="clearCanvasBtn">🗑️ مسح</button>
                    <button id="sendDrawingBtn">📤 إرسال الرسم</button>
                    <button id="closeDrawingBtn">❌ إغلاق</button>
                </div>
            </div>
        `;
        document.body.appendChild(chatScreenDiv);

        const backBtn = chatScreenDiv.querySelector('.back-btn');
        backBtn.addEventListener('click', () => { if(currentChatUnsub) currentChatUnsub(); chatScreenDiv.remove(); chatScreenDiv=null; loadHorizontalChats(); });

        const messagesDiv = chatScreenDiv.querySelector('#chatMessagesArea');
        const chatId = [currentUserId, contactId].sort().join('_');

        if (currentChatUnsub) currentChatUnsub();
        currentChatUnsub = db.collection('messages').doc(chatId).collection('msgs').orderBy('time').onSnapshot(snap => {
            messagesDiv.innerHTML = '';
            snap.forEach(doc => {
                const msg = doc.data();
                const isMine = msg.from === currentUserId;
                if (msg.type === 'haptic') {
                    const div = document.createElement('div');
                    div.className = `message-bubble ${isMine ? 'my-message' : 'other-message'} haptic-bubble`;
                    div.innerHTML = '<i class="fas fa-hand-peace"></i> ' + (msg.text || 'أرسل لك مشاعر لمسية');
                    messagesDiv.appendChild(div);
                    if (!isMine && 'vibrate' in navigator) {
                        navigator.vibrate([200, 100, 200]);
                    }
                } 
                else if (msg.type === 'drawing') {
                    const div = document.createElement('div');
                    div.className = `message-bubble ${isMine ? 'my-message' : 'other-message'} drawing-bubble`;
                    const imgCanvas = document.createElement('canvas');
                    imgCanvas.width = msg.drawingWidth || 200;
                    imgCanvas.height = msg.drawingHeight || 150;
                    const imgCtx = imgCanvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => { imgCtx.drawImage(img, 0, 0, imgCanvas.width, imgCanvas.height); };
                    img.src = msg.imageData;
                    div.appendChild(imgCanvas);
                    messagesDiv.appendChild(div);
                }
                else {
                    const div = document.createElement('div');
                    div.className = `message-bubble ${isMine ? 'my-message' : 'other-message'}`;
                    div.innerText = msg.text;
                    messagesDiv.appendChild(div);
                }
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // إرسال نص
        const sendTextBtn = chatScreenDiv.querySelector('#sendTextBtn');
        const textInput = chatScreenDiv.querySelector('#messageTextInput');
        sendTextBtn.addEventListener('click', async () => {
            const txt = textInput.value.trim();
            if(!txt) return;
            await db.collection('messages').doc(chatId).collection('msgs').add({
                from: currentUserId, to: contactId, text: txt, type: 'text', time: firebase.firestore.FieldValue.serverTimestamp()
            });
            textInput.value = '';
        });
        textInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendTextBtn.click(); });

        // ميزة 1: النقر الطويل لإرسال مشاعر (Haptic)
        const hapticBtn = chatScreenDiv.querySelector('#hapticBtn');
        let pressTimer;
        hapticBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pressTimer = setTimeout(async () => {
                await db.collection('messages').doc(chatId).collection('msgs').add({
                    from: currentUserId, to: contactId, type: 'haptic', text: '❤️ لمسة حب', time: firebase.firestore.FieldValue.serverTimestamp()
                });
                if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
                alert('تم إرسال مشاعر لمسية!');
            }, 800);
        });
        hapticBtn.addEventListener('touchend', () => clearTimeout(pressTimer));
        hapticBtn.addEventListener('touchcancel', () => clearTimeout(pressTimer));
        // للفأرة على الكمبيوتر
        hapticBtn.addEventListener('mousedown', () => { pressTimer = setTimeout(async () => { /* نفس الشيء */ }, 800); });
        hapticBtn.addEventListener('mouseup', () => clearTimeout(pressTimer));

        // ميزة 2: الرسم بالإصبع
        const drawingPanel = chatScreenDiv.querySelector('#drawingPanel');
        const toggleDrawBtn = chatScreenDiv.querySelector('#drawingToggleBtn');
        toggleDrawBtn.addEventListener('click', () => {
            drawingPanel.style.display = drawingPanel.style.display === 'none' ? 'block' : 'none';
            if (drawingPanel.style.display === 'block') initCanvas(chatScreenDiv);
        });
        const closeDrawBtn = chatScreenDiv.querySelector('#closeDrawingBtn');
        closeDrawBtn.addEventListener('click', () => drawingPanel.style.display = 'none');
        const clearCanvasBtn = chatScreenDiv.querySelector('#clearCanvasBtn');
        const sendDrawingBtn = chatScreenDiv.querySelector('#sendDrawingBtn');

        function initCanvas(container) {
            canvas = container.querySelector('#drawCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e6f5c';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            let painting = false;
            const getCoords = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                let x = (clientX - rect.left) * scaleX;
                let y = (clientY - rect.top) * scaleY;
                x = Math.min(Math.max(0, x), canvas.width);
                y = Math.min(Math.max(0, y), canvas.height);
                return { x, y };
            };
            const startDraw = (e) => {
                e.preventDefault();
                painting = true;
                const { x, y } = getCoords(e);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, y);
                ctx.stroke();
            };
            const draw = (e) => {
                if (!painting) return;
                e.preventDefault();
                const { x, y } = getCoords(e);
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };
            const endDraw = () => { painting = false; ctx.beginPath(); };
            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', endDraw);
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            clearCanvasBtn.addEventListener('click', () => {
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            });
            sendDrawingBtn.addEventListener('click', async () => {
                const imageData = canvas.toDataURL();
                await db.collection('messages').doc(chatId).collection('msgs').add({
                    from: currentUserId, to: contactId, type: 'drawing', imageData: imageData, drawingWidth: canvas.width, drawingHeight: canvas.height, time: firebase.firestore.FieldValue.serverTimestamp()
                });
                drawingPanel.style.display = 'none';
                alert('تم إرسال الرسم');
            });
        }
        if (drawingPanel.style.display === 'block') initCanvas(chatScreenDiv);
    }

    // QR and other functions
    document.getElementById('shareQrBtn')?.addEventListener('click', () => {
        if(!currentUserId) return;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>رمزك الشخصي</h3><div id="tempQr" style="display: flex; justify-content: center; margin: 20px;"></div><p>امسح هذا الرمز لإضافتك</p><button class="close-modal">إغلاق</button></div>`;
        document.body.appendChild(modal);
        new QRCode(modal.querySelector('#tempQr'), { text: currentUserId, width: 180, height: 180 });
        modal.querySelector('.close-modal').addEventListener('click', () => modal.remove());
    });
    document.getElementById('scanQrBtn')?.addEventListener('click', () => {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><div id="qr-reader" style="width:100%"></div><button class="close-modal">إلغاء</button></div>`;
        document.body.appendChild(modal);
        const html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async (decodedText) => {
            await html5QrCode.stop();
            modal.remove();
            if(decodedText === currentUserId) { alert("لا يمكن إضافة نفسك"); return; }
            const userExists = await db.collection('users').doc(decodedText).get();
            if(!userExists.exists) { alert("رمز غير صالح"); return; }
            const existing = await db.collection('contacts').where("userId","==",currentUserId).where("contactId","==",decodedText).get();
            if(!existing.empty) { alert("جهة اتصال موجودة"); return; }
            await db.collection('contacts').add({ userId: currentUserId, contactId: decodedText, createdAt: new Date() });
            alert("تمت الإضافة بنجاح");
            loadHorizontalChats();
        }).catch(err => { alert("خطأ بالكاميرا"); modal.remove(); });
        modal.querySelector('.close-modal').addEventListener('click', () => { html5QrCode.stop().catch(e=>{}); modal.remove(); });
    });
    document.getElementById('logoutBtn')?.addEventListener('click', async () => { await auth.signOut(); window.location.reload(); });
    auth.onAuthStateChanged(async (user) => {
        if (user) await loadUserData(user);
        else { authScreen.classList.remove('hidden'); mainApp.classList.add('hidden'); if(chatScreenDiv) chatScreenDiv.remove(); }
    });
